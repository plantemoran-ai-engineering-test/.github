name: "🚀 Feature request"
description: Suggest a new feature / enhancement for this project
labels: ["enhancement", "needs triage :exclamation:"]
title: "<enter title here>"
body:
  - type: textarea
    attributes:
      label: What problem are you trying to solve?
      description: A clear and concise description of what the problem is.
      placeholder: "e.g. I want to ..."
    validations:
      required: true

  - type: textarea
    attributes:
      label: Describe the solution you would like.
      description: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    attributes:
      label: What are the acceptance criteria for testers to pass this feature?
      description: |
        A clear and concise description of all acceptance criteria in checkbox-list format.
        The more details you can provide, the better.
      placeholder: |
        - [ ] Click on ...
        - [ ] Type ...
        - [ ] ...
        - [ ] Click ...
        - [ ] Ensure ...
    validations:
      required: false

  - type: textarea
    attributes:
      label: Describe alternatives you have considered.
      description: |
        A clear and concise description of any alternative solutions or features you have considered.
    validations:
      required: false

  - type: textarea
    attributes:
      label: Additional context.
      description: Add any other context or screenshots about the feature request here.
    validations:
      required: false